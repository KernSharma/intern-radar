{"hiringOrganization": {"@type": "Organization", "name": "Susquehanna International Group, LLP", "sameAs": "http://www.sig.com/"}, "validThrough": "2027-07-06T00:00:00.000Z", "jobLocation": [{"address": {"addressCountry": "HK", "streetAddress": "UNAVAILABLE", "@type": "PostalAddress", "postalCode": "UNAVAILABLE", "addressLocality": "Hong Kong", "addressRegion": "UNAVAILABLE", "postOfficeBoxNumber": "UNAVAILABLE"}, "@type": "Place"}], "employmentType": "OTHER", "@type": "JobPosting", "description": "<h2>Overview</h2>\n<p>Susquehanna is looking for highly motivated full-time students for our 10-week trading system engineering summer internship program based at our US Headquarters. <strong>This program offers students currently enrolled at universities in Hong Kong or Singapore the opportunity to intern in the US with the intention of long-term placement in our Hong Kong office.</strong></p>\n<p>&nbsp;</p>\n<p>This is a computationally intensive role that will allow you to use your strong technical skills to solve problems at the intersection of trading, data, and technology.</p>\n<p>Throughout the summer, you will receive education about how markets work by going through a deep dive into financial markets and Susquehanna’s approach to trading. You will also work on challenging projects for our trading strategy development teams in low latency C++ trading system development. Additionally, you’ll have the opportunity to work on projects side by side with senior developers who understand the nuances of building complex trading strategies.</p>\n<p>&nbsp;</p>\n<p>If your experience is a better fit for our 2027 Quantitative Strategy Development Internship, apply here: Quantitative Strategy Developer Internship: Summer 2027 in Hong Kong, Hong Kong | Susquehanna International Group, LLP</p>\n<h2>What we’re looking for</h2>\n<ul>\n <li>Studying at a Hong Kong or Singapore based university&nbsp;and plan to graduate in 2028.</li>\n <li>Enrolled in a bachelor's or master's program in computer science, computer engineering, mathematics, or closely related STEM discipline</li>\n <li>Strong software development skills in C++, C, Rust, C#, or Java, and some Python experience.</li>\n <li>Intention to graduate with a minimum of a bachelor’s degree and begin full time employment by August 2028</li>\n <li>Exceptional logical reasoning skills</li>\n <li>Visa sponsorship is available for this position.&nbsp;</li>\n</ul>\n<p><strong>What's in it for you:</strong></p>\n<ul>\n <li>Our non-hierarchical culture allows employees of every level to thrive and make impact. We are not your typical trading firm – the environment is casual, collaborative and we focus on continuous development</li>\n <li>Travel and housing covered for duration of internship</li>\n <li>Relaxed dress code: jeans and sneakers are the norm, shorts all summer long</li>\n <li>Fully stocked kitchens for breakfast, lunch, snacks, and beverages</li>\n <li>A forty thousand square-foot state of the art fitness facility with brand-new equipment, multi-purpose courts, group exercise classes, and locker room spaces</li>\n <li>Discounts for dining, entertainment, shopping, travel, and attractionsSocial events including a poker tournament, dinners, and sporting events in PhiladelphiaOn-site Wellness Center</li>\n <li>On-site services such as a mailroom, barber, dry cleaning, and car maintenance</li>\n <li>Opportunities to give back to the community through Susquehanna sponsored events and donation drives</li>\n</ul>\n<p><strong>About Susquehanna</strong></p>\n<p>Susquehanna is a global quantitative trading firm powered by scientific rigor, curiosity, and innovation. Our culture is intellectually driven and highly collaborative, bringing together researchers, engineers, and traders to design and deploy impactful strategies in our systematic trading environment. To meet the unique challenges of global markets, Susquehanna applies machine learning and advanced quantitative research to vast datasets in order to uncover actionable insights and build effective strategies. By uniting deep market expertise with cutting-edge technology, we excel in solving complex problems and pushing boundaries together.</p>\n<p>&nbsp;</p>\n<p><em>If you're a recruiting agency and want to partner with us, please reach out to recruiting@sig.com. Any resume or referral submitted in the absence of a signed agreement will not be eligible for an agency fee</em>.</p>\n<p>&nbsp;</p>", "directApply": true, "datePosted": "2026-07-06T00:00:00.000Z", "title": "Trading System Engineering Internship: Summer 2027", "occupationalCategory": "Interns + Co-ops", "@context": "http://schema.org", "url": "https://careers-sig.icims.com/jobs/11169/trading-system-engineering-internship%3a-summer-2027/job"}
